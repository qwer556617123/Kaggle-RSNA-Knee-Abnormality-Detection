[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsna-knee"
version = "0.1.0"
description = "Offline MRI research utilities and validation tools from an RSNA knee competition project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pydicom>=2.4",
  "scipy>=1.10",
  "Pillow>=10",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "torch>=2.2"]
models = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0,<2", "transformers>=4.40,<5", "safetensors>=0.4"]

[tool.setuptools.packages.find]
include = ["rsna_knee*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
